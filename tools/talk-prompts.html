<title>פרומפטים להרצאה · העתק והדבק</title>
<style>:root{--bg:#eef3f8;--card:#fff;--ink:#15202b;--dim:#5b6b7b;--line:#d3dce6;--accent:#2f6fa8;--accent2:#255a8c;--ok:#137a48;--okbg:#e4f3ec}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Heebo",Arial,sans-serif;direction:rtl;line-height:1.55;padding:20px 16px 60px}
.wrap{max-width:820px;margin:0 auto}h1{font-size:24px;font-weight:800}.sub{color:var(--dim);font-size:14px;margin:4px 0 16px}
h2{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.card .n{font-family:ui-monospace,monospace;font-weight:800;color:var(--accent);font-size:13px;flex:none;padding-top:10px;min-width:26px}
.card .body{flex:1}.card .p{font-size:15px;font-weight:600}.card .hint{color:var(--dim);font-size:12.5px;margin-top:4px}
button.copy{flex:none;background:var(--accent);color:#fff;border:none;border-radius:9px;font-weight:800;font-size:14px;padding:10px 16px;cursor:pointer;font-family:inherit}
button.copy:hover{background:var(--accent2)}button.copy.done{background:var(--ok)}
.note{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600;margin:14px 0}</style><div class="wrap"><h1>פרומפטים להרצאה</h1><div class="sub">לוחצים "העתק", עוברים לחלון הקופיילוט, מדביקים ב-Ctrl+V. הטקסט לא מופיע על המסך.</div><div class="note">בלוק אקסל: לוודא מצב "אפשר עריכה". שים לב להערות בסוגריים בכל קייס.</div></div><script>
const G={"אקסל · 01–05": [["01", "חשב את השונות בין שעות בפועל לתקציב, והוסף עמודת הפרש עם נוסחה מתאימה. לאחר מכן, על סמך העמודה שיצרת, ציין אילו פרויקטים דורשים טיפול, מה ההשלכה העסקית, ואילו ערכים הובילו למסקנה.", ""], ["02", "צור טבלת ציר לפי פרויקט וסטטוס בגיליון חדש. בחר את המדד המתאים מתוך האפשרויות שאתה מציע. לאחר היצירה, הסק אילו פרויקטים דורשים תשומת לב, הסבר על אילו נתונים בטבלה הסתמכת, ואם חסר מידע לתעדוף לפי חומרה — אמור בדיוק מה חסר.", ""], ["03", "הדגש באדום את השורות שבהן החריגה גדולה מ-20% מהתקציב, וצור תרשים עמודות שמשווה תקציב מול שעות בפועל לפי פרויקט. לאחר מכן, הסבר אילו חריגות הן בעדיפות לטיפול ומה בתרשים או בנתונים מוביל למסקנה.", ""], ["04", "כתוב סיכום מנהלים קצר במבנה מייל על סמך הנתונים: מצב כללי, חריגות עיקריות והמלצה אחת. אל תשלח מייל ואל תשנה את הקובץ. בסוף ציין איזו החלטה ניהולית נדרשת ולמה.", ""], ["05", "האם יש עובד שבסך כל הפרויקטים שלו עבר 180 שעות באוגוסט? אם כן — ציין מי, כמה שעות בסך הכול ובאילו פרויקטים; הסבר מהו סיכון הקיבולת ומה הפעולה הניהולית המומלצת.", ""]], "קופיילוט צ'אט · 06–07": [["06", "כמה שעות עבד אבי כהן בסך הכול באוגוסט 2026, לפי קובץ מעקב השעות של ואלור? אם אין לך גישה לנתון, אל תנחש: הסבר איזה מקור חסר ומדוע אי אפשר להסיק מסקנה ניהולית אמינה בלעדיו.", ""], ["07", "כמה שעות עבד אבי כהן בסך הכול באוגוסט 2026, לפי קובץ מעקב השעות של ואלור? ציין את הפרויקטים שעליהם הסתמכת, ומה ההשלכה הניהולית של התוצאה.", "צ'אט חדש! קודם מצרפים את קובץ הגלם דרך +, ואז:"]], "וורד · 08–10": [["08", "סכם את המסמך לחמש נקודות עיקריות עבור מנהל שלא נכח בפגישה, ובסוף ציין אילו החלטות או סיכונים דורשים מעקב מיידי ולמה.", ""], ["09", "הפוך את רשימת המשימות שבמסמך לטבלה עם עמודות: אחראי, משימה, תאריך יעד. לאחר מכן, ציין אילו משימות מסכנות ביצוע בגלל בעלים או תאריך חסרים.", ""], ["10", "נסח מחדש את הפסקה הראשונה בסגנון רשמי ותמציתי יותר, בלי לאבד עובדות מהותיות. בסוף ציין מהי ההחלטה הניהולית שנותרה פתוחה.", ""]], "פאוורפוינט · 11": [["11", "בנה מתווה מצגת של חמישה שקפים להדרכת עובדים על Copilot בארגון: מה זה, מה זה יודע לעשות באקסל ובוורד, מגבלות רישוי ודוגמה חיה. לכל שקף ציין את המסר או ההחלטה שהקהל אמור לקחת ממנו.", ""]], "טימס ואאוטלוק · 12–15": [["12", "כמה שעות עבד אבי כהן בסך הכול באוגוסט 2026, לפי הקובץ המצורף? ציין על איזה נתון הסתמכת, ובאיזו פעולה ניהולית תומכת המסקנה.", "באפליקציית Copilot בתוך טימס, אחרי צירוף קובץ הגלם:"], ["13", "סכם את השיחה הזו בנקודות: החלטות, משימות פתוחות ומה נקבע להמשך. בסוף ציין מה דורש בעלים או מעקב, ועל סמך איזה מסר בשיחה.", "אם בניגוד לצפוי יש אייקון Copilot בראש הצ'אט:"], ["14", "נסח מייל מקצועי מהנקודות שסופקו, בלי לשלוח אותו. בסוף ציין אילו החלטה, בעלים והמשך פעולה המייל מבהיר.", "אם בניגוד לצפוי יש \"נסח באמצעות Copilot\" — להזין את הנקודות מ\"נקודות-למייל.txt\""], ["15", "זה מייל שקיבלתי מלקוחה. סכם אותו לשלוש נקודות פעולה, ונסח טיוטת תשובה מקצועית בעברית שמאשרת את הבקשות וקובעת פגישה להמשך. בסוף הסבר מהי העדיפות של כל פעולה ואיזו מגבלה או התחייבות חייבים לשמור.", "ב-Copilot Chat, אחרי הדבקת גוף המייל הארוך:"]]};
const wrap=document.querySelector('.wrap');
Object.entries(G).forEach(([gname,items])=>{
  if(!items.length)return;
  const h=document.createElement('h2');h.textContent=gname;wrap.appendChild(h);
  items.forEach(([n,p,hint])=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="n"></div><div class="body"><div class="p"></div>'+(hint?'<div class="hint"></div>':'')+'</div><button class="copy">העתק</button>';
    c.querySelector('.n').textContent=n;c.querySelector('.p').textContent=p;
    if(hint)c.querySelector('.hint').textContent=hint;
    const b=c.querySelector('.copy');
    b.onclick=()=>{const done=()=>{b.textContent='הועתק ✓';b.classList.add('done');setTimeout(()=>{b.textContent='העתק';b.classList.remove('done')},1400)};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p).then(done).catch(()=>{fallback(p);done()})}else{fallback(p);done()}};
    wrap.appendChild(c);
  });
});
function fallback(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);}
</script>
