<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נווט רישוי Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================================
   A decision tool, not a product page. One accent (indigo), semantic colour
   reserved for included / partial / blocked, an 8px spacing scale, and a single
   type family. Tier tokens t1..t6 survive because the JS injects them by name,
   but they all resolve to the accent: tiers are told apart by heading and rule,
   not by a rainbow.
   ========================================================================== */
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --card-2:#FBFCFE; --sunk:#F1F3F9;
  --ink:#171A2B; --ink-2:#59606F; --muted:#59606F;
  --line:#E2E6EF; --line-2:#CFD5E4;
  --brand:#5B4FD6; --brand-ink:#FFFFFF; --brand-wash:#F0EEFF;
  --ok:#0E7350; --ok-w:#E7F4EF; --warn:#A15C00; --warn-w:#FBF1E3;
  --bad:#B42318; --bad-w:#FDECEA;
  --no:#5F6879;
  --acc:#5B4FD6;
  --sh:none;
  /* every tier resolves to the accent; differentiation is typographic */
  --panel:#3B3190; --t1:#8E87EA; --t2:#7A72E1; --t3:#675DD9; --t4:#5B4FD6; --t5:#4B40B4; --t6:#3B3190;
  --grad:#5B4FD6;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-ui="light"]){
    --bg:#0E1120; --surface:#171B2C; --card-2:#1B2033; --sunk:#12162492;
    --ink:#EAECF5; --ink-2:#B9C0D2; --muted:#B9C0D2;
    --line:#2A3048; --line-2:#3A4260;
    --brand:#9A8FF5; --brand-ink:#0E1120; --brand-wash:#211E3F;
    --ok:#63D3A8; --ok-w:#11291F; --warn:#E0A153; --warn-w:#2C2113;
    --bad:#F08078; --bad-w:#2E1614;
    --no:#98A2B8;
    --acc:#9A8FF5;
    --panel:#241F5E; --t1:#6C63C6; --t2:#7B72D6; --t3:#8A81E6; --t4:#9A8FF5; --t5:#AFA6F9; --t6:#C6BFFC;
    --grad:#9A8FF5;
  }
}
:root[data-theme="dark"],:root[data-ui="dark"]{
  --bg:#0E1120; --surface:#171B2C; --card-2:#1B2033; --sunk:#121624;
  --ink:#EAECF5; --ink-2:#B9C0D2; --muted:#B9C0D2;
  --line:#2A3048; --line-2:#3A4260;
  --brand:#9A8FF5; --brand-ink:#0E1120; --brand-wash:#211E3F;
  --ok:#63D3A8; --ok-w:#11291F; --warn:#E0A153; --warn-w:#2C2113;
  --bad:#F08078; --bad-w:#2E1614;
  --no:#98A2B8;
  --acc:#9A8FF5;
  --panel:#241F5E; --t1:#6C63C6; --t2:#7B72D6; --t3:#8A81E6; --t4:#9A8FF5; --t5:#AFA6F9; --t6:#C6BFFC;
  --grad:#9A8FF5;
}
:root[data-ui="light"]{
  --bg:#F6F7FB; --surface:#FFFFFF; --card-2:#FBFCFE; --sunk:#F1F3F9;
  --ink:#171A2B; --ink-2:#59606F; --muted:#59606F;
  --line:#E2E6EF; --line-2:#CFD5E4;
  --brand:#5B4FD6; --brand-ink:#FFFFFF; --brand-wash:#F0EEFF;
  --ok:#0E7350; --ok-w:#E7F4EF; --warn:#A15C00; --warn-w:#FBF1E3;
  --bad:#B42318; --bad-w:#FDECEA;
  --no:#5F6879; --acc:#5B4FD6;
  --panel:#3B3190; --t1:#8E87EA; --t2:#7A72E1; --t3:#675DD9; --t4:#5B4FD6; --t5:#4B40B4; --t6:#3B3190;
  --grad:#5B4FD6;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Assistant","Segoe UI",-apple-system,sans-serif;font-size:16px;line-height:1.62;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{direction:rtl;text-align:right;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border-radius:8px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
/* figures and identifiers read left to right even inside Hebrew */
.mono,.res-price,.step-p,.cell .v,.band .bv,.brk.n span:not(:first-child){
  direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- header: shorter, no gradient, a neutral mark ---------- */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{max-width:1440px;margin:0 auto;padding:var(--s2) clamp(var(--s3),3vw,var(--s4));
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:7px;background:var(--brand);flex:none;
  display:grid;place-items:center;color:var(--brand-ink);font-weight:800;font-size:.9rem;letter-spacing:.02em}
.htxt h1{font-size:clamp(24px,2.6vw,30px);line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}
.htxt p{margin:2px 0 0;font-size:.85rem;color:var(--ink-2);max-width:750px}
.asof{margin-inline-start:auto;font-size:.72rem;color:var(--ink-2);
  background:var(--sunk);border:1px solid var(--line);padding:5px 10px;border-radius:6px;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap}

.themetog{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.themetog button{border:0;background:none;padding:5px 10px;font-size:.72rem;font-weight:700;
  color:var(--ink-2);border-radius:6px;line-height:1.2}
.themetog button:hover{color:var(--ink)}
.themetog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* ---------- nav: compact tabs, underline for active ---------- */
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;overflow-x:auto}
nav.tabs::-webkit-scrollbar{height:3px}
nav.tabs::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.tabs-in{max-width:1440px;margin:0 auto;padding:0 clamp(var(--s3),3vw,var(--s4));display:flex;gap:var(--s3);min-height:56px;align-items:stretch}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:0 2px;
  font-size:.92rem;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:color .14s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);background:none}

main{flex:1;max-width:1440px;width:100%;margin:0 auto;padding:var(--s3) clamp(var(--s3),3vw,var(--s4)) var(--s5)}
.screen{display:none}
.screen.on{display:block;animation:fi .15s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}*{transition:none!important}}

h2.sh{font-size:clamp(22px,2.4vw,28px);line-height:1.28;margin:0 0 var(--s1);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
p.sub{color:var(--ink-2);margin:0 0 var(--s3);max-width:750px;font-size:.98rem}

/* ---------- a card is a section, not a floating box ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:var(--s3);margin-bottom:var(--s2)}
.card h3{margin:0 0 var(--s2);font-size:20px;line-height:1.4;color:var(--brand);font-weight:700;
  letter-spacing:normal;text-transform:none;padding-bottom:var(--s1);border-bottom:2px solid var(--brand-wash)}

/* ---------- choice controls ---------- */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(238px,100%),1fr));gap:var(--s1);min-width:0}
.pick{background:var(--surface);border:1px solid var(--line);padding:12px 14px;text-align:right;
  font-size:.93rem;line-height:1.4;transition:border-color .14s,background .14s;width:100%;
  display:flex;align-items:center;gap:10px;border-radius:8px}
.pick:hover{border-color:var(--brand);background:var(--card-2)}
.pick[aria-pressed="true"]{background:var(--brand-wash);color:var(--ink);border-color:var(--brand);font-weight:600}
.pick .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-2)}
.pick[aria-pressed="true"] .dot{background:var(--brand)}

.res{border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;margin-top:var(--s2)}
.res-top{padding:var(--s3);color:#fff;background:var(--panel);border-top:5px solid var(--tc,var(--brand));border-bottom:0}
.res-lbl{font-size:.72rem;color:#fff;opacity:.85;display:block;margin-bottom:4px;font-weight:700}
.res-tier{font-size:clamp(20px,2.2vw,26px);line-height:1.25;font-weight:800}
.res-price{font-weight:700;font-size:1.02rem;margin-top:6px;display:inline-block}
.res-body{padding:var(--s3);display:grid;gap:var(--s2)}
.res-row{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:start}
.res-k{font-size:.75rem;color:var(--ink-2);padding-top:3px;font-weight:700}
.res-v{font-size:.96rem}

.ladder{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s3)}
.step{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);
  border:1px solid var(--line);padding:12px 14px;text-align:right;transition:border-color .14s,background .14s;border-radius:8px}
.step:hover{border-color:var(--brand);background:var(--card-2)}
.step .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--tc,var(--line-2));flex:none;min-height:32px}
.step .txt{flex:1}
.step-n{font-weight:700;font-size:1rem;display:block}
.step-sub{font-size:.8rem;color:var(--ink-2);display:block}
.step-p{font-weight:700;font-size:.95rem;color:var(--ink)}
.step[aria-pressed="true"]{background:var(--brand-wash);border-color:var(--brand)}
.step[aria-pressed="true"] .step-sub{color:var(--ink-2)}
.step[aria-pressed="true"] .step-p{color:var(--ink)}
.step[aria-pressed="true"] .bar{background:var(--brand)}

/* ---------- capability matrix: sticky frame, zebra, one accent ---------- */
.mwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem;min-width:820px}
table.mx th{padding:12px 10px;text-align:center;font-size:.76rem;font-weight:700;line-height:1.3;
  color:var(--ink);background:var(--sunk);border-bottom:1px solid var(--line-2);
  position:sticky;top:0;z-index:3}
table.mx th:first-child{text-align:right;min-width:230px;inset-inline-start:0;z-index:4}
table.mx td{padding:0 10px;height:50px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
table.mx td:first-child{text-align:right;font-weight:600;position:sticky;inset-inline-start:0;
  background:var(--surface);z-index:2;font-size:.88rem;line-height:1.35;padding-block:8px}
table.mx tbody tr:nth-child(even) td{background:var(--card-2)}
table.mx tbody tr:nth-child(even) td:first-child{background:var(--card-2)}
table.mx tbody tr{cursor:pointer;transition:background .12s}
table.mx tbody tr:hover td,table.mx tbody tr:hover td:first-child{background:var(--brand-wash)}

/* status marks: semantic colour only, no pill soup */
.c{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;white-space:nowrap}
.c::before{content:"";width:9px;height:9px;border-radius:2px;flex:none}
.c-y{color:var(--ok)} .c-y::before{background:var(--ok)}
.c-p{color:var(--warn)} .c-p::before{background:var(--warn)}
.c-d{color:var(--brand)} .c-d::before{background:var(--brand)}
.c-f{color:var(--brand)} .c-f::before{background:none;border:1.5px solid var(--brand)}
.c-u{color:var(--ink-2)} .c-u::before{background:none;border:1.5px dashed var(--line-2)}
.c-n{color:var(--no)} .c-n::before{background:none;border:1.5px solid var(--line-2);opacity:.7}
tr.ghead th{background:var(--sunk);color:var(--ink);text-align:right;cursor:pointer;
  padding:10px 12px;font-size:.82rem;font-weight:700;border-bottom:1px solid var(--line-2);
  border-top:1px solid var(--line-2);position:sticky;top:44px;z-index:2}
tr.ghead th:hover{background:var(--brand-wash)}
tr.ghead .gt::before{content:"▾";display:inline-block;margin-inline-end:8px;color:var(--ink-2);font-size:.7em}
tbody.shut tr.ghead .gt::before{content:"▸"}
tr.ghead .gc{margin-inline-start:8px;color:var(--ink-2);font-weight:600;font-size:.76rem}
tbody.shut tr:not(.ghead){display:none}
.more{margin:var(--s2) 0 0;border-top:1px solid var(--line);padding-top:10px}
.more>summary{cursor:pointer;list-style:none;font-size:.84rem;font-weight:700;color:var(--brand);
  display:inline-flex;align-items:center;gap:8px;padding:2px 0}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸";font-size:.8em;color:var(--ink-2)}
.more[open]>summary::before{content:"▾"}
.more>summary:hover{text-decoration:underline;text-underline-offset:3px}
.more-in>.note:first-child{margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin:0 0 var(--s2);
  padding:10px 14px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;font-size:.8rem}

/* ---------- cost calculator ---------- */
.grid2{display:grid;grid-template-columns:1fr;gap:var(--s2);min-width:0}
.grid2>*{min-width:0}
.card{min-width:0}
.band{min-width:0}
@media(min-width:1000px){
  .grid2{grid-template-columns:340px minmax(0,1fr);align-items:start}
  .grid2>*:first-child{position:sticky;top:72px}
}
.field{margin-bottom:var(--s2)}
.field label{font-size:.88rem;font-weight:700;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.field label b{color:var(--brand);font-weight:700;direction:ltr;unicode-bidi:isolate}
.field .hint{font-size:.8rem;color:var(--ink-2);margin-top:5px;display:block}
.hlink{color:var(--brand);text-decoration:underline;text-underline-offset:2px;font-weight:600}
/* quality badge: is a cost line an official price list, a partial official mapping, or a directional estimate */
.qbadge{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:5px;margin-inline-start:8px;vertical-align:middle;white-space:nowrap}
.qb-official{background:var(--ok-w);color:var(--ok)}
.qb-partial{background:var(--warn-w);color:var(--warn)}
.qb-estimate{background:var(--warn-w);color:var(--warn)}
select{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:9px 10px;
  font-size:.92rem;width:100%;border-radius:8px}
select:disabled{opacity:.55}

/* one slider handle, identical in every engine */
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:22px}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--brand);border:2px solid var(--surface);margin-top:-7px;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--brand);
  border:2px solid var(--surface);cursor:pointer}

.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:var(--s1);margin-bottom:var(--s2);min-width:0}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.cell .k{font-size:.72rem;color:var(--ink-2);display:block;margin-bottom:4px;font-weight:700}
.cell .v{font-size:1.35rem;line-height:1.15;display:block;font-weight:800}
/* the one figure that matters gets weight, not a gradient */
.cell.hi{background:var(--brand);border:1px solid var(--brand)}
.cell.hi .k{color:var(--brand-ink);opacity:.85}
.cell.hi .v{color:var(--brand-ink)}

.band{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1);margin-bottom:var(--s2)}
.band>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.band .bk{font-size:.7rem;color:var(--ink-2);display:block;font-weight:700}
.band .bv{font-weight:700;font-size:1.02rem;display:block;margin-top:2px}
.band .mid{border-color:var(--brand);background:var(--brand-wash)}

/* ---------- data rows ---------- */
.brk,.brkhead{display:grid;gap:8px var(--s2)}
.brk{align-items:baseline;padding:10px 0;font-size:.88rem;border-bottom:1px solid var(--line)}
.brk:last-of-type{border-bottom:0}
.brkhead{padding-bottom:6px;font-size:.72rem;color:var(--ink-2);font-weight:700;border-bottom:1px solid var(--line-2)}
.brk>span,.brkhead>span{min-width:0;overflow-wrap:break-word}
.brk:not(.n),.brkhead:not(.n){grid-template-columns:minmax(5.5rem,.8fr) minmax(0,.72fr) minmax(0,.9fr) minmax(0,1.15fr)}
.brk:not(.n)>span:nth-child(2):last-child,.brkhead:not(.n)>span:nth-child(2):last-child{grid-column:2/-1}
.brk:not(.n)>span:nth-child(3):last-child,.brkhead:not(.n)>span:nth-child(3):last-child{grid-column:3/-1}
.brk .m{font-weight:700;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.brk .s{color:var(--ink-2);font-size:.83rem}
.brk.n,.brkhead.n{grid-template-columns:minmax(0,1fr) repeat(3,84px)}
.brk.n span:not(:first-child),.brkhead.n span:not(:first-child){text-align:left}
@media (max-width:640px){
  .brk:not(.n),.brkhead:not(.n){grid-template-columns:minmax(0,1fr)!important;row-gap:4px}
  .brk:not(.n)>span,.brkhead:not(.n)>span{grid-column:1/-1!important;text-align:right}
  .brk:not(.n){padding:14px 0}
  .brk:not(.n)>span:first-child{font-weight:700;color:var(--ink)}
  .brkhead:not(.n){display:none}
  .brk.n,.brkhead.n{grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr))!important;gap:6px 8px;font-size:.82rem}
  .brk.n span[style*="grid-column"]{grid-column:2/-1!important}
  .grid2>*:first-child{position:static}
  /* three nowrap money ranges cannot share 342px, so they stack */
  .band{grid-template-columns:1fr}
  .out{grid-template-columns:1fr}
}

ul.tight{margin:6px 0 0;padding-inline-start:1.1rem}
ul.tight li{margin-bottom:5px;font-size:.93rem}
.note{font-size:.86rem;color:var(--ink-2);margin:var(--s2) 0 0;max-width:90ch}
.card p,.card li,.card dd{max-width:90ch}
/* a caution is a margin note, not a second box */
.flag{border-inline-start:3px solid var(--warn);padding-inline-start:14px;
  font-size:.88rem;margin:var(--s2) 0 4px;color:var(--ink-2);max-width:90ch}
.flag b{color:var(--warn)}
/* every claim tagged verified can be checked */
.srcs{margin:var(--s2) 0 0;padding-block-start:10px;border-block-start:1px solid var(--line);
  font-size:.8rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px var(--s2)}
.srcs b{font-weight:700;color:var(--ink-2);font-size:.72rem;align-self:center;margin-inline-end:4px}
.srcs a{color:var(--brand);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.srcs a:hover{text-decoration-thickness:2px}
/* secondary action: bordered, tinted, never a bare underlined link */
.cta{border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:14px 16px;margin-bottom:var(--s2);font-size:.92rem;color:var(--ink);max-width:90ch}
.cta b{color:var(--ink)}
.cta a{display:inline-block;margin-top:8px;background:var(--brand-wash);color:var(--brand);
  border:1px solid var(--brand);border-radius:8px;padding:7px 14px;font-weight:700;text-decoration:none}
.cta a:hover{background:var(--brand);color:var(--brand-ink)}

</style>

<div class="app">
  <div class="hero"><div class="hero-in">
    <div class="logo">V</div>
    <div class="htxt"><h1>נווט רישוי Copilot</h1><p>מה כל רמה נותנת, מה היא עולה, ומתי כדאי לעלות</p></div>
    <div class="asof">נכון ל־31.08.2026 · USD list · ללא מע״מ</div>
    <div class="themetog" role="group" aria-label="ערכת צבעים">
      <button type="button" data-ui-set="auto">אוטומטי</button>
      <button type="button" data-ui-set="light">בהיר</button>
      <button type="button" data-ui-set="dark">כהה</button>
    </div>

(function(){
  var root=document.documentElement, KEY='copilot-nav-theme';
  var btns=[].slice.call(document.querySelectorAll('.themetog button'));
  if(!root||!root.setAttribute||!btns.length) return;
  function apply(v){
    if(v==='dark'||v==='light') root.setAttribute('data-ui',v); else {v='auto';root.removeAttribute('data-ui')}
    btns.forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-ui-set')===v?'true':'false')});
    try{localStorage.setItem(KEY,v)}catch(e){}
  }
  var saved='auto';
  try{saved=localStorage.getItem(KEY)||'auto'}catch(e){}
  apply(saved);
  btns.forEach(function(b){b.addEventListener('click',function(){apply(b.getAttribute('data-ui-set'))})});
})();

  ["מדידת אימוץ","<p style=\"margin:0 0 .7rem;font-size:.96rem\"><b>רישיון Copilot אחד מספיק כדי לפתוח את <a href=\"https://insights.cloud.microsoft\" target=\"_blank\" rel=\"noopener\" class=\"hlink\">הלוח</a>.</b> טבלת הזכאות ב-Learn (18.8.2026) קובעת שעיבוד הנתונים מתחיל עם 50 רישיונות Viva Insights <b>או רישיון Copilot אחד</b>. מה שהסף של 50 מגביל הוא היכולות המתקדמות בלבד, לא הגישה עצמה.</p><div class=\"brkhead\" style=\"grid-template-columns:150px 1fr\"><span>שער</span><span>מה צריך לדעת</span></div><div class=\"brk\" style=\"grid-template-columns:150px 1fr\"><span>רצפת גודל קבוצה</span><span style=\"text-align:right;font-family:inherit\"><b>ברירת מחדל 10 עובדים, מינימום 5</b><br><span class=\"s\">מחלקה בת שישה אנשים לא תופיע בהשוואה בין מחלקות עד שמנהל ישנה את הסף</span></span></div><div class=\"brk\" style=\"grid-template-columns:150px 1fr\"><span>מסננים ומפות חום</span><span style=\"text-align:right;font-family:inherit\"><b>דורשים רישיון Viva Insights</b><br><span class=\"s\">במסלול של Copilot בלבד, עם העלאת סקר מצטבר, אינם נתמכים</span></span></div><div class=\"brk\" style=\"grid-template-columns:150px 1fr\"><span>ניהול גישה</span><span style=\"text-align:right;font-family:inherit\"><b>דרך אפליקציית Viva Insights</b><br><span class=\"s\">הפקד הישן ומסלול ה-PowerShell בוטלו. כיבוי האפליקציה מכבה גם Copilot Analytics וגם advanced analysis</span></span></div><div class=\"brk\" style=\"grid-template-columns:150px 1fr\"><span>תפקיד נדרש</span><span style=\"text-align:right;font-family:inherit\"><b>AI Administrator</b><br><span class=\"s\">אינו מקבל גישה אוטומטית, חייב להוסיף את עצמו</span></span></div><div class=\"brk\" style=\"grid-template-columns:150px 1fr\"><span>זמני תפוגה</span><span style=\"text-align:right;font-family:inherit\"><b>24 שעות · 7 ימים · 3 ימים</b><br><span class=\"s\">שינוי גישה · העלאת נתונים ארגוניים · רשימת הרחקה</span></span></div><div class=\"brk\" style=\"grid-template-columns:150px 1fr\"><span>Agent Dashboard</span><span style=\"text-align:right;font-family:inherit\"><b>public preview בלבד</b><br><span class=\"s\">קיים לצד Copilot Dashboard ו-Consumption Dashboard</span></span></div><details class=\"more\"><summary>פרטים נוספים (3)</summary><div class=\"more-in\"><p class=\"note\"><b>פרטיות, נקודה שעדיף להעלות מראש.</b> בברירת מחדל נכלל בלוח גם שימוש ב-Copilot Chat בדפדפן של עובדים שאינם מורשי Copilot, שימוש שאינו קשור לשום רישיון. רשימת הרחקה מאפשרת להחריג אותם. בארגון עם ועד עובדים זו שיחה שעדיף לנהל לפני הגילוי.</p><p class=\"note\"><b>ארבעה צירי מדידה:</b> אימוץ ושימוש, יעילות ותפוקה, ערך עסקי, ואמון ותאימות. הנתונים הכמותיים ב-Copilot Dashboard וב-Usage Report: אימוץ לפי אפליקציה, תאריך פעילות אחרון לכל משתמש מורשה, שימוש ברמת פיצ׳ר, השוואה בין מחלקות ורצף שבועות שימוש. ‏Exchange Online חובה, תיבות משותפות אינן נתמכות.</p><p class=\"note\"><b>הערה תפעולית ללקוח.</b> ניהול הטמעת Copilot אינו תוספת של 5% למשרה קיימת אלא לפחות 50% משרה. ארגונים שמקצים את זה כתוספת צדדית נכשלים. מקור יחיד.</p></div></details><div class=\"srcs\"><b>מקור</b><a href=\"https://learn.microsoft.com/en-us/viva/insights/org-team-insights/copilot-dashboard\" target=\"_blank\" rel=\"noopener\">טבלת הזכאות ללוח</a><a href=\"https://learn.microsoft.com/en-us/viva/insights/advanced/admin/manage-settings-copilot-dashboard\" target=\"_blank\" rel=\"noopener\">הגדרות הלוח ורצפת הקבוצה</a><a href=\"https://learn.microsoft.com/en-us/viva/insights/advanced/setup-maint/environment-requirements\" target=\"_blank\" rel=\"noopener\">דרישות סביבה ל-Viva Insights</a></div>"],
  ["מסע ההטמעה, עשרה שלבים","<p style=\"margin:0 0 .6rem;font-size:.96rem\">התשובה לשאלה ״מה עושים אחרי הרכישה״. זו מתודולוגיה של מיישם ולא תיעוד של Microsoft — <b>תיוג: מקור יחיד</b> — אבל היא מתומחרת בפועל אצל לקוחות ולכן משפיעה על היקף העסקה.</p><div class=\"brkhead\" style=\"grid-template-columns:28px 130px 1fr\"><span>#</span><span>שלב</span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>1</span><span>רישוי ותיק עסקי</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">למה בכלל. בלי תשובה טובה לשאלת ה״למה״, שום דבר לא מחזיק לאורך זמן</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>2</span><span>מנדט ואפיון</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">ההנהלה מחליטה על אסטרטגיה; מגדירים בעלי עניין ומושפעים</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>3</span><span>תשתית ונתונים</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">לא שלב IT בלבד. אם החיווט לא נכון, החשמל פשוט לא זורם</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>4</span><span>רתימת הנהלה</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">לא אירוע חד-פעמי אלא מעגל הנהגה מתמשך</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>5</span><span>פיילוט ממוקד</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">קבוצה מצומצמת, ללמוד ולתקן, לייצר הצלחות קטנות מוקדם</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>6</span><span>זיהוי Champions</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">שגרירי שינוי, מזוהים דרך סקר למנהלים או יחד עם משאבי אנוש</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>7</span><span>הדרכה והנגשה</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">השלב עתיר המאמץ: וובינרים, סדנאות, ליווי אחד על אחד</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>8</span><span>הרחבה והפצה</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">סיפורי הצלחה מהפיילוט; יצירת ביקוש פנימי</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>9</span><span>מדידה ושיפור</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">לא שלב סיום — מלווה את כל התהליך</span></span></div><div class=\"brk\" style=\"grid-template-columns:28px 130px 1fr\"><span>10</span><span>הכרה והוקרה</span><span style=\"text-align:right;font-family:inherit\"><span class=\"s\">חגיגת הצלחות, קהילות פנימיות שממשיכות להוביל</span></span></div><details class=\"more\"><summary>פרטים נוספים (5)</summary><div class=\"more-in\"><p class=\"note\">לאורך כל עשרת השלבים רצה <b>תקשורת פנים-ארגונית</b> כשכבה עוטפת, לא כשלב נפרד.</p><p class=\"note\"><b>מי מוביל.</b> הפרויקטים שמצליחים הם אלה שיש בהם <b>פונקציה אחת חוצת-ארגון</b> שמדברת גם עסקית וגם טכנולוגית — מנהל חדשנות, מנהל טרנספורמציה דיגיטלית, או צוות קטן של IT, דאטה וביזנס. במקביל נדרשת רתימה מפורשת מלמעלה: הכרזה של מנכ״ל או סמנכ״ל מערכות מידע.</p><p class=\"note\"><b>חלוקת אחריות למדידה:</b> מוביל שינוי ארגוני (ניהול שינוי, משאבי אנוש) אחראי על הנתונים האיכותיים; צוות IT אחראי על הכמותיים מ-Usage Report ו-Copilot Dashboard; מנהל פרויקט עסקי מחבר את השניים ומדווח להנהלה. <b>קצב:</b> baseline לפני ההשקה, ואז בדיקה חוזרת כל שלושה חודשים.</p><p class=\"note\"><b>חמישה מעגלים שמהם נגזרת האסטרטגיה:</b> חזון ויעדים עסקיים ← אסטרטגיית AI ← תהליכים עסקיים ← אנשים ויכולות ← תרבות וערכים. הניסוח שלהם שווה אימוץ בשיחת מכירה: <b>AI טוב אינו זה שמחליף תהליך, אלא זה שלוקח תהליך ומעצים אותו.</b></p><p class=\"note\"><b>מול המחלקה המשפטית.</b> נדרשת מדיניות שימוש כתובה — למשל אם מותר להשתמש בתמלולי שיחות. מדדי תאימות אפשריים: אחוז העובדים שעברו הכשרה לשימוש אחראי, חתימה על אישור קריאה, או סימולציה קצרה ב-LMS.</p></div></details>"]

  ["Workflows agent, אוטומציה בלי Copilot Studio","<p style=\"margin:0 0 .6rem;font-size:.96rem\">סוכן בשם Workflows, המסומן Frontier, בונה זרימות אוטומציה בשפה טבעית בלי קוד. מתחת למכסה הוא <b>Power Automate</b>, עם אותם קונקטורים לאותן מאות מערכות. מעליו יושבת שכבת אורקסטרציה של Copilot והארקה דרך Microsoft Graph שמכבדת הרשאות. הוא קורא את עץ הארגון, ולכן ״כשמגיע מייל מהמנהל שלי״ נפתר מעצמו.</p><div class=\"flag\"><b>זו הנקודה הרישויית.</b> אם היכולת תצא ל-GA כפי שהודגמה, היא מכניסה אוטומציה מבוססת קונקטורים לתוך רישיון Copilot — בלי רישיון Copilot Studio נפרד. עד אז <b>אין להבטיח אותה בהצעת מחיר</b>.</div>"],
  ["תזמור סוכנים, איך זה נראה בפועל","<p style=\"margin:0 0 .7rem;font-size:.96rem\">בהדגמה חיה נבנו ב-Copilot Studio ארבעה סוכנים. זו התשובה ללקוח ששואל ״מה בונים אחרי הסוכן הראשון״.</p><div class=\"brkhead\"><span>סוכן</span><span style=\"grid-column:2/5\">מה יש בו</span></div><div class=\"brk\"><span>סוכן ידע</span><span>ספריית מסמכים ב-SharePoint בלבד. בלי כלים, בלי סוכנים אחרים</span><span></span><span></span></div><div class=\"brk\"><span>סוכן מבצע</span><span>שני כלים: ‏MCP ל-Outlook ויצירת אירוע ביומן. בלי ידע</span><span></span><span></span></div><div class=\"brk\"><span>סוכן בקשות</span><span>נושא שיחה אחד שאוסף פרטים, ואוטומציית אישורים ב-Power Automate</span><span></span><span></span></div><div class=\"brk\"><span><b>Master Agent</b></span><span><b>אין בו ידע, כלים או נושאים — רק סוכנים והנחיות מתי לקרוא לכל אחד</b></span><span></span><span></span></div><p class=\"note\">ההנחיה למאסטר כללה תנאי מפורש: סוכן היומן מופעל <b>רק</b> אחרי שהתקבל אישור מהמנהל. משתמש הקצה מדבר עם סוכן אחד ואינו יודע על השאר. <b>מקור יחיד.</b></p>"],
  ["מחיר המחירון אינו המחיר הסופי","<p style=\"margin:0 0 .6rem;font-size:.96rem\">בוובינר של שותף Microsoft ישראלי הוצג קמפיין: לקוחות על <b>Business Standard או Business Premium</b> יכלו לשדרג כך שהחבילה תכלול את Microsoft 365 Copilot <b>בתוספת של $12 למושב</b>, ברכישה של עשרה באנדלים ומעלה, עד סוף יוני 2026.</p><div class=\"flag\"><b>הקמפיין פג. המסקנה לא.</b> מול מחיר מחירון של $30 לתוסף, הפרש כזה מלמד שיש מרווח מסחרי אצל השותפים. אל תתייחסו למחשבון העלות כאן כאל מחיר סופי — הוא מחיר מחירון, ונקודת פתיחה למשא ומתן.</div><p class=\"note\"><b>מקור יחיד</b> · קמפיין שותף שתוקפו פג ביוני 2026.</p>"]

  ["Copilot Fall Release, אוקטובר 2025","<p style=\"margin:0 0 .7rem;font-size:.96rem\"><b>תיקון ייחוס.</b> ‏12 היכולות האלה הן ה-Copilot Fall Release שהוכרז ב-<b>23.10.2025</b>, ולא עדכון מאוגוסט 2026. הן שייכות בעיקר ל-<b>Copilot לצרכן</b> ואינן סט זכאויות של Microsoft 365 Copilot ארגוני, ולכן אין להסיק מהן מה מקבל מושב מורשה בארגון. מייקרוסופט שחררה עדכון רחב לאפליקציית Copilot, הכולל 12 יכולות שהמטרה שלהן להפוך אותו לאישי, תומך ומחובר יותר. חלקן כבר זמינות וחלקן צפויות בשבועות הקרובים.</p><div class=\"brkhead\"><span>יכולת</span><span style=\"grid-column:2/5\">מה היא נותנת</span></div><div class=\"brk\"><span>AI חברתי</span><span style=\"grid-column:2/5\" class=\"s\">שיחות קבוצתיות עד 32 משתתפים, כולל סיכומים, הצבעות וחלוקת משימות</span></div><div class=\"brk\"><span>זיכרון ארוך טווח</span><span style=\"grid-column:2/5\" class=\"s\">זוכר פרטים חשובים וחוזר אליהם בעתיד, עם דמות ויזואלית חדשה לשיחות קוליות</span></div><div class=\"brk\"><span>הצעות יזומות</span><span style=\"grid-column:2/5\" class=\"s\">פעולות המשך מוצעות על בסיס פעילות קודמת</span></div><div class=\"brk\"><span>למידה אינטראקטיבית</span><span style=\"grid-column:2/5\" class=\"s\">שאלות, לוחות ויזואליים והכוונה קולית</span></div><div class=\"brk\"><span>דפדפן AI</span><span style=\"grid-column:2/5\" class=\"s\">מבין הקשר, מסכם מידע, מבצע פעולות וניווט קולי</span></div><div class=\"flag\"><b>לא ברור אילו מהיכולות דורשות רישיון Copilot בתשלום ואילו כלולות ב-Chat החינמי.</b> השותף הציג זאת כשדרוג לאפליקציית Copilot בכללותה, בלי הבחנה לפי SKU. יש לבדוק בטננט לפני שמבטיחים משהו ללקוח.</div><p class=\"note\"><b>מקור יחיד</b> · הוצג כפתיחה לוובינר מנהל הכספים, 23.8.2026.</p><div class=\"srcs\"><b>מקור</b><a href=\"https://www.microsoft.com/en-us/microsoft-copilot/blog/2025/10/23/human-centered-ai/\" target=\"_blank\" rel=\"noopener\">ההכרזה המקורית, 23.10.2025</a></div>"],
  ["תשובת Outlook שנוסחה ב-AI, והגילוי לפני שליחה","<p style=\"margin:0 0 .6rem;font-size:.96rem\">כשמשתמש מבקש מ-Copilot לנסח תשובה למייל על בסיס תכתובת קודמת, האפליקציה <b>מציגה התראה מפורשת לפני השליחה</b>: ״התשובה מנוסחת בקופיילוט — שים לב לקרוא עליה״. זו הגנה מובנית שמזכירה למשתמש לבדוק את התוצר לפני שהוא יוצא בשמו.</p><p class=\"note\">זה חיזוק מוצרי לעיקרון שחוזר בכל סדרת הוובינרים: <b>האחריות הסופית על התוצר נשארת אצל המשתמש</b>, ו-Copilot נותן בסיס של 60 עד 70 אחוז ולא תשובה סופית. שווה להזכיר את הפיצ׳ר הזה ללקוחות שדואגים מהאמינות של תשובות אוטומטיות. מקור יחיד.</p>"],
  ["Reconciliation אוטומטי, מה קרה בפועל בהדגמה","<p style=\"margin:0 0 .7rem;font-size:.96rem\">Excel Agent קיבל כרטסת קאש מול דוח בנק לאותו חודש, ומשימה: לבצע התאמה ולאתר חריגים. זמן הריצה: <b>69 שניות</b>.</p><div class=\"brkhead\"><span>שלב</span><span style=\"grid-column:2/5\">מה נדרש בפרומפט</span></div><div class=\"brk\"><span>הנחיה מרכזית</span><span style=\"grid-column:2/5\" class=\"s\">״צור נוסחאות Excel בכל גיליון כדי שההתאמה תהיה ניתנת לבדיקה בכל שורה״ — לא מספיק לבקש תשובה, צריך לדרוש נוסחה שקופה</span></div><div class=\"brk\"><span>רמז קריטי</span><span style=\"grid-column:2/5\" class=\"s\">״שים לב שסכומים מסוימים עלולים להיות כפולים״ — בלי הרמז הזה הסוכן לא בהכרח מטפל בכפילויות נכון</span></div><div class=\"flag\"><b>התוצאה כמעט מושלמת אך לא באופן אוטומטי.</b> הסוכן בנה נוסחת דירוג לזיהוי סכומים חוזרים ואז נוסחת LOOKUP להתאמה. כל השורות התאימו חוץ משתי רשומות בקאש בלי מקבילה בבנק, ושתיים הפוך. לפי מנהל המוצר, לא תמיד התוצאה בפעם הראשונה היא הטובה ביותר — צריך להנחות את הסוכן כמו עובד, עם הבהרות נוספות.</div><p class=\"note\">זו דוגמה קונקרטית לאותה משמעת פרומפטים (Goal, Context, Source, Expectation) שמופיעה גם בוובינר הפרומפטים והאקסל. <b>מקור יחיד.</b></p>"],
  ["Teams, Word ו-PowerPoint: מה השתנה לאחרונה","<p style=\"margin:0 0 .6rem;font-size:.96rem\"><b>סיכום Teams מתבסס גם על הצ׳אט, לא רק על התמלול.</b> הודעות, קישורים ונקודות שסוכמו בצ׳אט הפגישה נכנסים עכשיו ל-AI Notes. שני התנאים המקוריים עדיין נדרשים: תמלול מופעל, והזימון יצא מהארגון.</p><div class=\"flag\"><b>Upload from this device, עם השלכת ממשל שקטה.</b> קובץ מקומי שמעלים ל-Copilot Chat נשמר בפועל ל-OneDrive — כי Copilot פועל רק על תוכן ענני. קובץ שמעולם לא היה בענן הופך להיות שם, בלי שהמשתמש בהכרח קולט שזו ״העלאה״ במובן הממשלי.</div><p style=\"margin:.6rem 0;font-size:.94rem\"><b>Word:</b> לפי השותף, עד 10 רפרנסים (במקום 3), בלי הגבלת תווים על הפרומפט, וכ-80,000 מילה בסך כל הרפרנסים. סוגים נתמכים: Word, PowerPoint, PDF, פגישות, דוא״ל — לא Excel. <u>שימו לב:</u> מקורות כלליים של Microsoft מזכירים גם תקרה של כ-2,000 תווים על טקסט הפרומפט עצמו ומספר פריטים שנע בין 10 ל-20 לפי הקשר — כדאי לבדוק בפועל בטננט לפני שמבטיחים ״בלי הגבלה״ ללקוח.</p><p style=\"margin:.6rem 0;font-size:.94rem\"><b>סיכום אוטומטי ב-Word אינו ברירת מחדל</b> — יש להפעיל דרך תפריט Copilot בסרגל הכלים. כרגע בעיקר ב-Web; פיצ׳רים חדשים מגיעים לווב לפני האפליקציות השולחניות, דפוס עקבי בכל הסדרה.</p><p style=\"margin:.6rem 0;font-size:.94rem\"><b>Word, שני עדכונים נוספים:</b> ביבליוגרפיה אוטומטית עם רפרנסים למסמכים שהתבסס עליהם — צפוי להתגלגל מיוני. וסיכום מצורפת עם שני פקדים בפאנל \"Summary by Copilot\": כפתור <b>\"Ask Copilot\"</b> לצ׳אט ממוקד, ותפריט <b>\"Summarize a file\"</b>. בראש התפריט מופיע <b>\"Only certain files are supported\"</b> — לא כל סוגי הצרופות נתמכים. (תוקן מצילום מסך; קודם נרשם \"AS Copilot\".)</p><details class=\"more\"><summary>פרטים נוספים (2)</summary><div class=\"more-in\"><p class=\"note\"><b>PowerPoint:</b> נתיב פנים-ארגוני (אנשים, מסמכים, פגישות, מיילים) ונתיב חוץ-ארגוני עם אג׳נדה הניתנת לעריכה מלאה. הוספת נושא בנתיב החוץ-ארגוני יכולה למשוך דטה פנים-ארגוני דרך סלאש — הנתיבים מצטלבים ברמת הנושא הבודד. מקור יחיד.</p><p class=\"note\">Clean Data with Copilot הגיע לאפליקציה השולחנית לאחרונה — היה זמין רק בווב כחצי שנה קודם לכן.</p></div></details>"],
  ["Facilitator, ותשובת Q&A שכדאי לצטט מילה במילה","<p style=\"margin:0 0 .6rem;font-size:.96rem\"><b>Facilitator — כתיבה שיתופית בזמן אמת של פרוטוקול הפגישה.</b> בשונה מ-AI Notes שמסכם אחרי מעשה, Facilitator כותב את הפרוטוקול תוך כדי הפגישה, והמשתמש יכול לערוך במקביל לצידו — שיתוף פעולה חי, לא רק תוצר סופי. עד לאחרונה היה זמין רק בווב; עכשיו זמין גם באפליקציה השולחנית. <b>יש להפעיל אותו מראש באפשרויות הפגישה</b> ב-Teams, לכל פגישה בנפרד.</p><p style=\"margin:.6rem 0;font-size:.94rem\"><b>שפת ה-Recap ניתנת לבחירה, בנפרד משפת הפגישה.</b> עד עכשיו אם התמלול היה בעברית הסיכום יצא בעברית ולהפך. עכשיו אפשר לבחור את שפת הסיכום באופן עצמאי — שימושי לפגישה שהתנהלה באנגלית אך הצוות המקומי רוצה סיכום בעברית.</p><div class=\"flag\"><b>הציטוט הכי חד בכל הוובינר, כשנשאלה מה זמין ללא רישוי:</b> \"לצערי הרב שום דבר ממה שהצגתי לא יחכה למישהו ללא רישוי. כל מה שהצגתי הוא חלק מחבילת קופיילוט 365.\" משפט מוכן לשימוש מול לקוח שמנסה להבין מה הוא מקבל בחינם.</div><p class=\"note\">Q&A נוסף: יצירת קובץ Excel עם תוכן בעברית עובדת, גם אם שם הקובץ עצמו נשאר באנגלית — שאלה של פורמט, לא מגבלה עקרונית. מקור יחיד.</p>"],
  ["Copilot Memory, הטבלה המלאה ותבנית לסוכן טוב","<p style=\"margin:0 0 .6rem;font-size:.96rem\">הבעיה שהיא פותרת — Copilot היסטורית הרגיש פחות ״חבר״ מ-ChatGPT כי לא זכר כלום בין שיחות. Memory סוגר את הפער בלי לאמן את המודל על הנתונים.</p><div class=\"brkhead\"><span>מה</span><span style=\"grid-column:2/5\">איך</span></div><div class=\"brk\"><span>למידה</span><span>משיחות קודמות, פרופיל ארגוני, והנחיות מפורשות ב-Settings → Personalization</span><span></span><span></span></div><div class=\"brk\"><span>למידה פסיבית</span><span>בונה פרופיל: תחומי עניין, שפה, קצב בקשות — ומציע יזום בלי שביקשו</span><span></span><span></span></div><div class=\"brk\"><span>עדכון הזיכרון</span><span>בשפה טבעית דרך הצ׳אט עצמו — ״מעכשיו עדכן אותי כל שבועיים״</span><span></span><span></span></div><div class=\"brk\"><span>בדיקה ומחיקה</span><span>״מה אתה זוכר על ההעדפות שלי״ בצ׳אט. המסך: <b>Personalization → Copilot memory</b>, שתי לשוניות (Copilot memory / Work profile), מחיקה פר-פריט, ובתחתית מתג ראשי ו-<b>Delete all memories</b></span><span></span><span></span></div><div class=\"brk\"><span>מידע רגיש</span><span>Temporary Chat — שום דבר לא נשמר לזיכרון</span><span></span><span></span></div><div class=\"brk\"><span>כיבוי ארגוני</span><span><b>מנהל הטננט מכבה לכולם ברמת הטננט</b></span><span></span><span></span></div><div class=\"flag\"><b>Sounds Like Me עדיין לא שוחרר.</b> זה הפיצ׳ר שאמור לפתור סופית את התאמת סגנון הכתיבה; עד אז Memory + Personalization הם הפתרון הזמני.</div><p style=\"margin:.7rem 0 .4rem;font-size:.96rem\"><b>שלוש הדוגמאות המדויקות שהודגמו לרמות הסוכן:</b> Basic — ״מה הסטטוס של שלב 2 בפרויקט X ומה התקציב הנותר?״ Advanced — ״סקור את כל הזמנות הרכש הפתוחות ושלח לי אותן למייל״. Autonomous — מזהה פנייה חדשה לתמיכה ומנתב אותה בלי שאף אחד ביקש.</p><p style=\"margin:.6rem 0;font-size:.94rem\"><b>Agent Store</b> (\"Find agents to help you complete any task\"). <b>Your agents:</b> Meeting Summarizer, Researcher (Frontier), Analyst (Frontier), Sales Expert, Competitor Insights Bot, Visual Creator, <b>Copilot Assistance</b>, HR Helper. <b>Built by Microsoft:</b> Researcher, Analyst, Visual Creator, <b>Prompt Coach</b>, <b>Writing Coach</b>, <b>Idea Coach</b>.</p><p class=\"note\"><b>תבנית לסוכן מותאם אישית, ניתנת לשימוש ישיר:</b> סוכן \"Meeting Summarizer\" עם הנחיות מדויקות — פתיחה ב״שלום לכולם״, סיום ב״בברכה, [שם]״, מבנה קבוע של נקודות מפתח ואז Action Items, וגוף ראשון רבים (״קיימנו״, ״עשינו״). זרימת העבודה: בלי לכתוב פרומפט — \"/\" ואז קישור הפגישה המתומללת, והסוכן מחזיר סיכום גמור בסגנון האישי. מקור יחיד.</p>"]

  ["מגבלות Knowledge, ושני מנגנוני חיבור שלא לבלבל ביניהם","<div class=\"flag\"><b>תיקון: זו לא מדרגה אחת.</b> וובינר אחר תיאר ״512MB עם רישיון, 7MB בלעדיו״ — לא מדויק. יש שני מנגנונים נפרדים, מאומת מול Microsoft Learn.</div><div class=\"brkhead\"><span>מנגנון</span><span>בלי USL</span><span>עם USL</span><span></span></div><div class=\"brk\"><span>SharePoint, מחובר בזמן אמת</span><span>עד 7MB לקובץ</span><span>עד 200MB, ואיכות חיפוש טובה יותר</span><span></span></div><div class=\"brk\"><span>Upload / סנכרון ל-Dataverse</span><span>עד 512MB</span><span>עד 512MB, זהה</span><span></span></div><div class=\"brkhead\"><span>מגבלה נוספת</span><span style=\"grid-column:2/5\">הערך</span></div><div class=\"brk\"><span>קבצים לסוכן בסך הכל</span><span style=\"grid-column:2/5\">עד 500. עד 1,000 קבצים למקור SharePoint/OneDrive בודד, סנכרון כל 4-6 שעות</span><span></span></div><div class=\"brk\"><span>Instructions</span><span style=\"grid-column:2/5\">עד 8,000 תווים</span><span></span></div><div class=\"brk\"><span>טבלאות בתוך מסמכים</span><span style=\"grid-column:2/5\">קובץ PDF שהועלה נהנה מזיהוי תמונות וטבלאות, ו-Copilot מחלץ טבלה מ-PDF או מצילום מסך. טבלאות מורכבות עדיין מצריכות בדיקה, ולעיתים Data from Picture ב-Excel מהיר יותר</span><span></span></div><div class=\"brk\"><span>תוכן מוטמע (embedded)</span><span style=\"grid-column:2/5\">מאונדקס רק ב-750 עד 1,000 עמודים ראשונים, כ-1.8 מיליון תווים</span><span></span></div><p style=\"margin:.6rem 0;font-size:.94rem\"><b>ככל שהקובץ קרוב יותר לסוכן, איכות התשובות גבוהה יותר.</b> מקור ידע ממוקד וקטן עדיף על ספרייה עצומה אחת. מ-Build (2-3 ביוני 2026, בפריוויו): אפשר לקבץ כמה אתרי SharePoint למקור ידע אחד בעל שם.</p><div class=\"brkhead\"><span>מנגנון</span><span style=\"grid-column:2/5\">איך הוא עובד</span></div><div class=\"brk\"><span>Graph Connectors</span><span>אינדוקס מראש למערכות בשם: Salesforce, Confluence, ServiceNow, Zendesk. מהיר לאחר ההקמה</span><span></span><span></span></div><div class=\"brk\"><span>Power Platform Connectors (~1,400)</span><span>בזמן אמת, בלי אינדוקס — שאילתה חיה בכל פנייה</span><span></span><span></span></div><div class=\"brk\"><span>קונקטורים לפעולות, Tools (~1,500)</span><span>לביצוע פעולות, לא לשליפת ידע. כולל קונקטורים מותאמים אישית</span><span></span><span></span></div><p class=\"note\">מקור יחיד. ה-RAG רץ &quot;בקופסה&quot; על Azure AI Search: embeddings וחיפוש סמנטי אינם ניתנים לקונפיגורציה. RAG מותאם אישית נבנה ב-Foundry ומחובר כמקור ידע.</p>"],
  ["MCP, Deep Reasoning ותזמור חוצה-פלטפורמות","<p style=\"margin:0 0 .6rem;font-size:.96rem\"><b>MCP נתמך.</b> שלושה שלבים: custom connector לשירות היעד → הצבעה על ה-MCP server → חיבור בין השניים. אחרי החיבור הוא זמין גם ל-Power Automate, לא רק לסוכן.</p><div class=\"flag\"><b>Deep Reasoning הוא הגדרה לכלי בודד, לא לסוכן כולו.</b> תפיסה שגויה נפוצה: הפעלתו לא הופכת את כל הסוכן לחשיבה מעמיקה. יש להנחות במפורש איזה כלי צריך reasoning ומתי. עולה יותר בכוח עיבוד — אבל מפחית הזיות ומשפר דיוק באותו כלי. שווה להפעיל דווקא בכלים שבהם טעות יקרה, ולכבות בשאר לחיסכון.</div><p style=\"margin:.6rem 0;font-size:.94rem\"><b>תזמור חוצה-פלטפורמות (Build, יוני 2026, מתגלגל).</b> מעבר ל-Master Agent שמתזמר בין סוכני Studio, כבר אפשר לחבר סוכן שנבנה ב-Azure AI Foundry, ובקרוב גם סוכני Microsoft 365 Copilot — אורקסטרציה בין כמה פלטפורמות בתזמור אחד.</p><p class=\"note\">BYOM ל-1,900 מודלי Foundry עדיין בפריוויו פרטי, צפוי להיפרס בשבועות הקרובים. ברירת המחדל נותרת GPT-4o. RPA מתוך Studio ו-Code Interpreter (Python בסוכן, לא ב-Excel) הוכרזו ב-Build (2-3 ביוני 2026) ועדיין מתגלגלים. מקור יחיד.</p>"],
  ["שלושה מתגים בשמם המדויק, ומה RAG לא עושה","<p style=\"margin:0 0 .6rem;font-size:.96rem\"><b>לכיוון סוכן שנשען על SharePoint, לפי Learn, כבו שלושה מתגים בשמם המדויק:</b> Web Search ברמת הסוכן, Use general knowledge ברמת הסוכן, ו-Allow the AI to use its own general knowledge (preview) ברמת ה-generative answers node. כשהשלושה כבויים, סוכן שלא מוצא תשובה ב-Knowledge עונה \"no response\" במקום להמציא.</p><div class=\"flag\"><b>מה RAG לא מבטיח, כדאי לומר ללקוח לפני שהוא מצפה לזה:</b> ‏RAG מביא מידע ומחזיר תשובה מנוסחת. הנחיות מותאמות <b>כן</b> שולטות בעיצוב ובפורמט, אבל התוצאה אינה דטרמיניסטית: לפלט שחייב להיות זהה בכל פעם מוסיפים workflow ואימות. הוא אינו מבטיח פלט לפי תבנית קשיחה — למשל מבנה חוזה עם כותרות מדויקות כמו שביקשתם — ואינו ״לומד״ מהשימוש.</div><p style=\"margin:.6rem 0;font-size:.94rem\"><b>זמן אינדוקס:</b> בין דקות ליום שלם, לרוב שעה עד 12 שעות. אין מוניטור שמראה ״המידע מוכן״ — תשובות חלשות בדקות הראשונות לא אומרות שיש בעיה.</p><p style=\"margin:.6rem 0;font-size:.94rem\"><b>אנטי-פטרן: שרת קבצים מקומי.</b> קונקטור קיים תיאורטית, אך לפי השותף ״רחוק רחוק מהמציאות״ מבחינת איכות. ההמלצה: מיגרציה ל-SharePoint Online לפני בניית הסוכן.</p><p class=\"note\">רישוי SharePoint Agent: עם USL אחד לפחות בטננט הוא \"built-in\" למורשים; משתמשים לא מורשים צורכים אותו סוכן ב-PAYG. RBAC לניהול ריבוי סוכנים חוצה-סביבות דורש תפקיד Power Platform Admin. מקור יחיד, למעט שמות המתגים והמגבלות שמאומתים.</p><div class=\"srcs\"><b>מקור</b><a href=\"https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/retrieval-augmented-generation\" target=\"_blank\" rel=\"noopener\">הנחיות RAG ב-Copilot Studio</a></div>"]

class=\"brkhead\"><span>קביעה</span><span style=\"grid-column:2/5\">פירוט</span></div><div class=\"brk\"><span>Copilot Chat + Analytics</span><span style=\"grid-column:2/5\">כלולים (●) בכל שלוש תוכניות ה-Business ובכל שמונה תוכניות ה-Enterprise, כולל Office 365 E1. ‏Analytics נוסף ביולי 2026.</span></div><div class=\"brk\"><span>Microsoft 365 Copilot</span><span style=\"grid-column:2/5\">כלול (●) רק ב-E7. בכל שאר התוכניות — תוסף (+).</span></div><div class=\"brk\"><span>Microsoft Security Copilot</span><span style=\"grid-column:2/5\">כלול ב-E5 וב-E7: ‏400 SCU לחודש לכל 1,000 משתמשים, עד 10,000 SCU. בשאר התוכניות תוסף, כולל שלוש תוכניות ה-Business.</span></div><div class=\"brk\"><span>Agent 365</span><span style=\"grid-column:2/5\">עמודת רישוי משל עצמו. שכבת בסיס — Agent ID, ‏Agent Registry, ‏insights בסיסיים ופעולות ממשל — כלולה בכל התוכניות; השכבה המתקדמת, כולל Agent Security, ב-E7 וברישיון Agent 365.</span></div><div class=\"brk\"><span>Copilot Studio for Teams</span><span style=\"grid-column:2/5\">כלול בכל שלוש תוכניות ה-Business — בונה צ׳אטבוטים בתוך Teams, בלי הודעות כלולות.</span></div><div class=\"brk\"><span>בלי Teams</span><span style=\"grid-column:2/5\">כמעט כל תוכנית — Business, ‏E1/E3/E5/E7, ‏F1/F3 — זמינה לרכישה גם בגרסה בלי Teams, במחיר נמוך יותר.</span></div><p class=\"note\"><b>מאומת</b> · ‏Modern Work Plan Comparison — SMB ו-Enterprise, פורסמו 1.8.2026. יומני השינויים המלאים של שני המסמכים — בנספח הדוח.</p>"],["Copilot Studio, אוגוסט 2026: הקרדיטים, ה-harnesses והממשל","<p style=\"margin:0 0 .7rem;font-size:.96rem\">מדריך הרישוי הרשמי מאוגוסט 2026 מחדד ש-<b>Copilot Credits</b> הם יחידת צריכה משותפת ל-Copilot Studio, ‏Microsoft Copilot, ‏Cowork, Dynamics 365, ‏Power Platform ו-Work IQ APIs. זה לא מחליף את המושב; זה ציר חיוב נפרד.</p><p><b>שלושת ה-harnesses.</b> ‏GitHub Copilot מיועד לבנייה אג'נטית מקצה לקצה; Standard לסוכנים שיחתיים עם topics ו-flows; ו-Copilot Chat להתאמת Copilot לידע ארגוני. ב-Standard וב-Copilot Chat, הרצה פנימית בערוצי Microsoft תחת זהות של משתמש Microsoft Copilot מורשה כפופה ל-fair use. ‏GitHub harness ו-Work IQ APIs אינם נכללים בפטור.</p><p><b>ארבע דרכי תשלום.</b> ‏PAYG: ‏$0.01 לקרדיט; Copilot Credit P3 שנתי: 300K–300M קרדיטים בהנחה של 5%–20%; Agent P3 שנתי: 20K/100K/500K ‏ACU, כאשר ACU=$1=100 קרדיטים, לשירותים זכאים ב-Studio וב-Foundry; או חבילת קיבולת $200 ל-25,000 קרדיטים לחודש. יתרות חבילה אינן מתגלגלות; P3 ו-Agent P3 פוקעים בסוף השנה.</p><p><b>רישוי יוצר וממשל.</b> ‏PAYG/P3 דורשים Copilot Studio Author ($0); חבילת קיבולת דורשת Copilot Studio User License ($0) לכל בונה. ב-PPAC מנהלים צריכה, מגבילים שיתוף לפי Editor/Viewer ומכבים פרסום סוכני GenAI. קיבולת Dataverse הראשונית לטננט עם מסלול קרדיטים היא 15GB Database, ‏20GB File ו-2GB Log.</p><div class=\"flag\"><b>ההבחנה החשובה ל-Cowork.</b> האקסל שסופק הוא מודל תקציב כיווני ל-Cowork, לא מחירון או התחייבות של Copilot Studio. הוא מניח Anthropic Opus 4.8, ו-Microsoft מצהירה במפורש שהעלות בפועל יכולה להשתנות לפי אזור, זמינות, עומס ומספר משתמשים.</div><p class=\"note\"><b>מקור:</b> Microsoft Copilot Studio Licensing Guide, August 2026, עמ' 4-15 ו-20; CustomerCoworkEstimator(Budget).xlsx שסופק ב-31.8.2026.</p>"]];
